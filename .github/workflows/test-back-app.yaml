name: Test Backend Application
on:
    pull_request:
        branches:
            - master
            - develop
jobs:
    test-app:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository code
              uses: actions/checkout@v4  
            - uses: actions/setup-java@v4
              with:
                distribution: 'temurin'
                java-version: '21'
            - run: sudo ./gradlew test
              working-directory: ./api